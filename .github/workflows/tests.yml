name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install ".[test]"

      - name: Test
        run: python -m pytest -v

  EndToEnd:
    # Builds the container locally and runs one real job (Dandiset 000006, streamed from S3) the
    # way a Dandiset repository's Validate workflow does, against local stand-ins for GitHub, and
    # compares the repository with tests/expected_output.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Apptainer
        uses: ./.github/actions/setup-apptainer

      - name: Install
        # With the test extra, for the expected-output helpers that check the results.
        run: python -m pip install ".[test]"

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run one job end to end
        run: bash scripts/e2e_local.sh 000006 "${{ runner.temp }}/e2e"

      - name: Upload the repository the job made
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expected-output-actual
          path: ${{ runner.temp }}/e2e/actual
          include-hidden-files: true
          if-no-files-found: ignore
