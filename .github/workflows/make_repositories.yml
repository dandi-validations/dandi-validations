name: Make repositories

# Creates dandi-validations/{dandiset_id} for every non-empty, open Dandiset that lacks one, and
# syncs the managed files (the Validate workflow, README, dataset_description.json, ...) into
# every one, as bids-dandisets/scripts does for its organization.
#
# Needs the `_GITHUB_API_KEY` secret: a fine-grained personal access token (classic tokens are
# refused) for the organization's repositories, with Administration, Contents, Workflows and
# Actions write access (see docs/README.md).

on:
  workflow_dispatch:
    inputs:
      dandiset_ids:
        description: Comma-separated Dandiset IDs, e.g. 000003,000004 (default, all of them)
        type: string
        default: ""
      limit:
        description: At most this many Dandisets (default, no limit)
        type: string
        default: ""
      codebase_ref:
        description: >-
          Branch, tag, or full 40-character commit SHA of this repository that the Dandiset
          repositories' workflows use. A short SHA does not work. A branch is followed to its latest
          commit on every run, while a commit SHA pins them.
        type: string
        default: main
      dispatch:
        description: Also start the validation of each repository
        type: boolean
        default: false
#  schedule:
#    - cron: "41 3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  MakeRepositories:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      _GITHUB_API_KEY: ${{ secrets._GITHUB_API_KEY }}
      DANDISET_IDS: ${{ inputs.dandiset_ids }}
      LIMIT: ${{ inputs.limit }}
      CODEBASE_REF: ${{ inputs.codebase_ref || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install .

      - name: Create and sync the Dandiset repositories
        run: |
          set -euo pipefail
          selection=()
          if [ -n "$DANDISET_IDS" ]; then selection+=(--dandisets ${DANDISET_IDS//,/ }); fi
          if [ -n "$LIMIT" ]; then selection+=(--limit "$LIMIT"); fi
          dandi-validations ensure-repos "${selection[@]}" --ref "$CODEBASE_REF"

      - name: Start their validations
        if: inputs.dispatch
        run: |
          set -euo pipefail
          selection=()
          if [ -n "$DANDISET_IDS" ]; then selection+=(--dandisets ${DANDISET_IDS//,/ }); fi
          if [ -n "$LIMIT" ]; then selection+=(--limit "$LIMIT"); fi
          dandi-validations dispatch "${selection[@]}"
