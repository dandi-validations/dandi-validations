name: Build and publish container

# Mints the dandi-validate container on this organization's GitHub Container Registry:
#
#   ghcr.io/dandi-validations/dandi-validate:<version>      OCI image (Docker)
#   ghcr.io/dandi-validations/dandi-validate:latest
#   ghcr.io/dandi-validations/dandi-validate:sif-<version>  the same image as an Apptainer SIF (ORAS)
#
# The version and the dandi-cli commit come from src/dandi_validations/pipeline.json, which is
# also what every Dandiset repository's validation job reads to decide which image to run. Bump
# `container.version` there whenever the image changes: jobs are keyed on it.
#
# The SIF is published so that every job pulls byte-identical image content. Its annex key is
# then the same in every repository's `datalad containers-run` records, and jobs skip the
# Docker-to-SIF conversion.

on:
  workflow_dispatch:
    inputs:
      overwrite:
        description: "Rebuild and overwrite tags that already exist for this version"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - "containers/dandi-validate/**"
      - "src/dandi_validations/pipeline.json"
      - ".github/workflows/build_container.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  BuildAndPublish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read pins from pipeline.json
        id: pins
        run: |
          set -euo pipefail
          pins=src/dandi_validations/pipeline.json
          image=$(jq -r '.container.image' "$pins" | tr '[:upper:]' '[:lower:]')
          version=$(jq -r '.container.version' "$pins")
          {
            echo "image=${image}"
            echo "version=${version}"
            echo "dandi_cli_repository=$(jq -r '.dandi_cli.repository' "$pins")"
            echo "dandi_cli_commit=$(jq -r '.dandi_cli.commit' "$pins")"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip versions that are already published
        id: existing
        env:
          REFERENCE: ${{ steps.pins.outputs.image }}:${{ steps.pins.outputs.version }}
        run: |
          if docker manifest inspect "$REFERENCE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${REFERENCE} exists; bump container.version in pipeline.json to publish a new image."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.existing.outputs.exists == 'false' || inputs.overwrite
        uses: docker/setup-buildx-action@v4

      - name: Build and push the OCI image
        if: steps.existing.outputs.exists == 'false' || inputs.overwrite
        id: build
        uses: docker/build-push-action@v7
        with:
          context: containers/dandi-validate
          file: containers/dandi-validate/Dockerfile
          push: true
          build-args: |
            DANDI_CLI_REPOSITORY=${{ steps.pins.outputs.dandi_cli_repository }}
            DANDI_CLI_COMMIT=${{ steps.pins.outputs.dandi_cli_commit }}
            CONTAINER_VERSION=${{ steps.pins.outputs.version }}
          tags: |
            ${{ steps.pins.outputs.image }}:${{ steps.pins.outputs.version }}
            ${{ steps.pins.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Apptainer
        if: steps.existing.outputs.exists == 'false' || inputs.overwrite
        uses: ./.github/actions/setup-apptainer

      - name: Convert to SIF and push it with ORAS
        if: steps.existing.outputs.exists == 'false' || inputs.overwrite
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="${{ steps.pins.outputs.image }}"
          version="${{ steps.pins.outputs.version }}"
          apptainer build dandi-validate.sif "docker://${image}@${{ steps.build.outputs.digest }}"
          apptainer exec --cleanenv dandi-validate.sif dandi-validate-versions > versions.json
          echo "$REGISTRY_PASSWORD" | apptainer registry login --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push dandi-validate.sif "oras://${image}:sif-${version}"
          {
            echo "## dandi-validate ${version}"
            echo
            echo "| Artifact | Reference |"
            echo "| --- | --- |"
            echo "| OCI image | \`docker://${image}:${version}\` |"
            echo "| OCI digest | \`${{ steps.build.outputs.digest }}\` |"
            echo "| SIF | \`oras://${image}:sif-${version}\` |"
            echo "| SIF sha256 | \`$(sha256sum dandi-validate.sif | cut -d' ' -f1)\` |"
            echo
            echo '```json'
            jq '{container_version, dandi_cli, python, git_annex, key_distributions}' versions.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
