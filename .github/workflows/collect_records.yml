name: Collect records

# Collects the jobs table of every Dandiset repository of the organization into records/:
#   records/jobs.tsv    every job capsule
#   records/latest.tsv  the most recent job capsule of each Dandiset
# Both are described by their .json sidecars.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  Collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install .

      - name: Collect the jobs tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dandi-validations collect --output records

      - name: Commit the records
        run: |
          set -euo pipefail
          git add records
          if git diff --cached --quiet; then
            echo "No changes to the records."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect validation records"
          git push
