[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dandi-validations"
version = "0.1.2"
description = "Run streaming DANDI validation per Dandiset on GitHub Actions and record each run as a job capsule."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Cody Baker", email = "cody.c.baker.phd@gmail.com" }]
dependencies = [
    # Host-side tools for running a job capsule. The validation itself runs inside the
    # dandi-validate container (see containers/dandi-validate), not with these.
    "datalad >= 1.1",
    "datalad-container >= 1.2.5",
    "con-duct >= 0.13",
    "git-annex",
    "jinja2 >= 3.1",
    "requests >= 2.28",
]

[project.optional-dependencies]
test = ["pytest >= 8"]

[dependency-groups]
dev = [
    "pytest >= 8",
    "pre-commit",
]

[project.scripts]
dandi-validations = "dandi_validations._cli:main"

[project.urls]
Repository = "https://github.com/dandi-validations/dandi-validations"

[tool.hatch.build.targets.wheel]
packages = ["src/dandi_validations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ai_generated: mark test as AI-generated",
    "container: runs the dandi-validation image with Apptainer (see scripts/e2e_local.sh)",
    "network: needs access to the DANDI Archive's S3 bucket",
    "datalad: needs datalad, datalad-container and git-annex on the host",
]

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
line-length = 120
extend-exclude = [
  "*/__init__.py",
  "tests/example_dandiset",
  "tests/expected_output",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Copyright headers are not added yet
    "CPY001",
    # Docstring style: prefer the D213 / D211 conventions
    "D203",
    "D212",
    # Small integer literals (exit codes, byte limits) are clearer inline than as named constants
    "PLR2004",
    # Fine to use Unicode characters
    "RUF003",
    # `tests/` is deliberately not a Python package
    "INP001",
    # We use relative imports within the package (see AGENTS.md)
    "TID252",
    # The pipeline runs git, git-annex, DataLad and Apptainer by name, with arguments it builds itself
    "S603",
    "S607",
]
# The docstring-to-code checks (pydoclint) are still preview rules, so preview is on but only
# rules named by their exact code are selected from it. DOC502 is left off so that a docstring
# may document an exception raised by a helper the function calls.
preview = true
explicit-preview-rules = true
extend-select = ["DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]
fixable = ["ALL"]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
# The command-line interfaces print their results
"src/dandi_validations/_cli.py" = ["T201"]
"containers/dandi-validation/dandi-validation-versions" = ["T201"]
# Tests rely on `assert` (S101), commonly access private members (SLF001),
# omit per-module/per-function docstrings (D100, D103), and reference
# predictable temp paths in fixtures (S108)
"tests/**/*.py" = [
    "S101",
    "S108",
    "SLF001",
    "D100",
    "D103",
    "FBT001",
]

[tool.ruff.lint.isort]
relative-imports-order = "closest-to-furthest"
known-first-party = ["dandi_validations"]

[tool.numpydoc_validation]
checks = [
    "all",
    # Examples, See Also, and an extended summary are not expected on every object
    "EX01",
    "SA01",
    "ES01",
    # Docstrings end with a blank line before the closing quotes, which ruff's D413 asks for
    "GL02",
    "GL03",
]
# Names with a leading underscore are not part of the documented API
exclude = ['\._\w+$']

[tool.mypy]
python_version = "3.12"
files = ["src/dandi_validations"]

[tool.codespell]
skip = "*.jsonld,*.tsv,*.lock,./tests/expected_output,./tests/example_dandiset"
